worker_processes 4;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;

  upstream app_servers {
    server ctfd:8000;
  }

  server {
    listen 80;
    gzip on;
    client_max_body_size 4G;

    location /assets/ {
      alias /opt/CTFd/frontend/dist/assets/;
      types {
        application/javascript js mjs;
        text/css css;
        image/svg+xml svg;
      }
      if_modified_since off;
      add_header Last-Modified "";
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      expires off;
    }

    location ~ ^/(api|auth|events|themes|files|plugins|healthcheck|robots\.txt|init-data) {
      proxy_pass http://app_servers;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Forwarded-Prefix "";
      proxy_set_header Connection '';
      proxy_http_version 1.1;
      chunked_transfer_encoding off;
      proxy_buffering off;
      proxy_cache off;
    }

    # Auth routes: POST → Flask, GET → SPA
    location /login { error_page 418 = @flask; recursive_error_pages on; if ($request_method = POST) { return 418; } try_files $uri /index.html; }
    location /register { error_page 418 = @flask; recursive_error_pages on; if ($request_method = POST) { return 418; } try_files $uri /index.html; }
    location /confirm { error_page 418 = @flask; recursive_error_pages on; if ($request_method = POST) { return 418; } try_files $uri /index.html; }
    location /reset_password { error_page 418 = @flask; recursive_error_pages on; if ($request_method = POST) { return 418; } try_files $uri /index.html; }
    location /logout { error_page 418 = @flask; recursive_error_pages on; if ($request_method = POST) { return 418; } try_files $uri /index.html; }

    # Setup: POST → Flask, GET → SPA
    location /setup {
      error_page 418 = @flask;
      recursive_error_pages on;
      if ($request_method = POST) { return 418; }
      try_files $uri /index.html;
    }

    location @flask {
      proxy_pass http://app_servers;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Forwarded-Prefix "";
      proxy_set_header Connection '';
      proxy_http_version 1.1;
      chunked_transfer_encoding off;
      proxy_buffering off;
      proxy_cache off;
    }

    location / {
      root /opt/CTFd/frontend/dist;
      index index.html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
