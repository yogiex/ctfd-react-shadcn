services:
  ctfd:
    build: .
    restart: always
    environment:
      - UPLOAD_FOLDER=/var/uploads
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
      - REDIS_URL=redis://cache:6379
      - WORKERS=${WORKERS:-1}
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
      - REVERSE_PROXY=true
      - SECRET_KEY=${SECRET_KEY:-}
    volumes:
      - logs:/var/log/CTFd
      - uploads:/var/uploads
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      default:
      internal:

  permissions:
    image: alpine:3.23
    user: root
    volumes:
      - logs:/var/log/CTFd
      - uploads:/var/uploads
    command: chown -R 1001:1001 /var/uploads /var/log/CTFd

  nginx:
    image: nginx:stable-alpine
    restart: always
    volumes:
      - ./conf/nginx/http.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/opt/CTFd/frontend/dist:ro
    ports:
      - "${PORT:-8000}:80"
    depends_on:
      ctfd:
        condition: service_started
    networks:
      default:
      internal:

  db:
    image: mariadb:10.11
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_PASSWORD:-ctfd}
      - MARIADB_USER=ctfd
      - MARIADB_PASSWORD=${DB_PASSWORD:-ctfd}
      - MARIADB_DATABASE=ctfd
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      internal:
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --wait_timeout=28800
      - --log-warnings=0
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  cache:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis:/data
    networks:
      internal:
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  default:
  internal:
    internal: true

volumes:
  logs:
  uploads:
  mariadb:
  redis:
