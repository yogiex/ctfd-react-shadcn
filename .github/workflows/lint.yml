---
name: Linting

on:
  push:
    branches: [master, react-fullstack]
  pull_request:
    branches: [master, react-fullstack]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11']

    name: Linting
    steps:
      - uses: actions/checkout@v5
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            python -m pip install -r linting.txt
            cd CTFd/themes/admin && corepack yarn install --non-interactive
            npm install -g prettier@3.2.5

      - name: Lint frontend
        run: |
            npm ci
            npm run lint
        working-directory: ./frontend

      - name: Lint
        run: make lint
        env:
            TESTING_DATABASE_URL: 'sqlite://'

      - name: Lint Dockerfile
        uses: brpaz/hadolint-action@master
        with:
          dockerfile: "Dockerfile"

      - name: Lint docker-compose
        run: |
            docker compose -f docker-compose.yml config

      - name: Lint translations
        run: |
          make translations-lint

      - name: Check translations are compiled
        run: |
          make translations-compile
          git diff --exit-code CTFd/translations/ || (echo "Translations need to be recompiled" && exit 1)
